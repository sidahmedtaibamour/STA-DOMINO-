name: Build Domino APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unzip the newest project zip
        run: |
          BEST=""; BT=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
            if [ "$t" -ge "$BT" ]; then BT=$t; BEST="$f"; fi
          done
          if [ -z "$BEST" ]; then echo "No .zip file found in the repository root"; exit 1; fi
          echo "Using: $BEST"
          rm -rf proj && mkdir proj
          unzip -q -o "$BEST" -d proj
          S=$(find proj -maxdepth 4 -name settings.gradle | head -n1)
          if [ -z "$S" ]; then echo "settings.gradle not found inside the zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: STA-Domino-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

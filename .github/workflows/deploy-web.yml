name: Deploy Domino web to GitHub Pages
# يفكّ ملف domino-web.zip على GitHub ويعرضه كموقع. (إن رفعتَ الملفات مفكوكة فسيستعملها مباشرة)
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site
        run: |
          mkdir -p _site
          if [ -f domino-web.zip ]; then
            unzip -q -o domino-web.zip -d _site
          elif [ -f index.html ]; then
            cp -r index.html manifest.json sw.js privacy.html robots.txt sitemap.xml _site/ 2>/dev/null || true
            cp *.png _site/ 2>/dev/null || true
          fi
          test -f _site/index.html || { echo "index.html not found (upload domino-web.zip or the unzipped files)"; exit 1; }
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

<title>Domino</title>
<style>
:root{
  --gold:#f2c14e;--gold2:#ffdf8a;--ink:#f4f1e8;--mut:#a9b8b0;
  --bg1:#0a1d17;--bg2:#06100c;
  --felt1:#1f7a52;--felt2:#0f4a31;--rim:#5b3517;
  --tileTop:linear-gradient(145deg,#fffdf6 0%,#efe6cf 100%);--tileSide:#c9bd9c;--tileEdge:rgba(90,70,30,.35);
  --pip:#161616;--line:#7a6a40;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg2);color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,textarea{font:inherit;color:inherit}
textarea,input{-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;
  background:radial-gradient(120% 80% at 50% 0%,#14392c 0%,var(--bg1) 45%,var(--bg2) 100%);overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));min-height:0}
h1,h2,h3{margin:0}
.title{font-size:34px;font-weight:900;letter-spacing:1px;text-align:center;color:var(--gold);text-shadow:0 3px 0 #7a5200,0 8px 18px rgba(0,0,0,.5)}
.sub{color:var(--mut);text-align:center;font-size:14px;margin:4px 0 0}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.center{align-items:center;justify-content:center;text-align:center}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:12px}
.lbl{font-size:13px;color:var(--mut);margin:2px 2px 6px}

/* أزرار */
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:800;font-size:17px;color:#2a1a00;cursor:pointer;
  background:linear-gradient(#ffe08a,#f2a900);box-shadow:0 5px 0 #9a6500,0 10px 18px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9a6500,0 4px 8px rgba(0,0,0,.4)}
.btn.alt{background:linear-gradient(#58d39a,#1f9a62);color:#032416;box-shadow:0 5px 0 #0f5e3b,0 10px 18px rgba(0,0,0,.4)}
.btn.alt:active{box-shadow:0 2px 0 #0f5e3b}
.btn.ghost{background:rgba(255,255,255,.09);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)}
.btn.danger{background:linear-gradient(#ff8f8f,#d33b3b);color:#fff;box-shadow:0 5px 0 #7d1d1d}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .sm{font-weight:600;font-size:12px;opacity:.8;display:block}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn:active{transform:scale(.94)}

/* صورة اللاعب */
.avatar{border-radius:50%;background:#1d4d3b;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;
  border:2px solid rgba(255,255,255,.35);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar span{line-height:1}
.profile-card{display:flex;align-items:center;gap:12px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:linear-gradient(#ffe08a,#f2a900);color:#2a1a00;border-color:#f2a900}
.input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink)}
textarea.input{resize:none;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
.menu-btns{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:#9be8c3;background:rgba(40,160,110,.15);border:1px solid rgba(80,220,150,.25);padding:5px 10px;border-radius:999px}
.hr{height:1px;background:rgba(255,255,255,.08);margin:6px 0}
.back{align-self:flex-start}

/* النوافذ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:80;animation:fade .18s}
.sheet{width:100%;max-width:600px;max-height:92%;overflow-y:auto;background:linear-gradient(#17372c,#0d241c);border-radius:22px 22px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));
  border-top:2px solid rgba(242,193,78,.5);animation:rise .22s;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:21px;color:var(--gold)}
.modal.mid{align-items:center}.modal.mid .sheet{border-radius:22px;width:calc(100% - 28px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(10,10,10,.9);border:1px solid rgba(255,255,255,.2);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:15px;max-width:86%;text-align:center;animation:fade .2s}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emoji-grid .cell{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;border:2px solid transparent}
.emoji-grid .cell.on{border-color:var(--gold);background:rgba(242,193,78,.18)}
.qrbox{background:#fff;border-radius:14px;padding:6px;align-self:center;max-width:100%}
.qrbox canvas{display:block;width:min(260px,70vw);height:min(260px,70vw);image-rendering:pixelated}
.scanbox{position:relative;align-self:center;width:min(280px,76vw);aspect-ratio:1;border-radius:16px;overflow:hidden;background:#000;border:2px solid var(--gold)}
.scanbox video{width:100%;height:100%;object-fit:cover}
.seatcard{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.seatcard .nm{font-weight:800}
.seatcard .st{font-size:12px;color:var(--mut)}
.pin{font-family:ui-monospace,monospace;letter-spacing:3px;color:var(--gold);font-weight:800}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.06);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--gold)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px}
.switch .tg{width:50px;height:28px;border-radius:99px;background:#3a4a43;position:relative;flex:none;transition:.2s;cursor:pointer}
.switch .tg::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch .tg.on{background:#2fbf80}.switch .tg.on::after{right:25px}
.rules p,.rules li{font-size:15px;line-height:1.7;color:#e6efe9}
.rules ul{padding-inline-start:20px;margin:6px 0}

/* الشعار ثلاثي الأبعاد */
.logo{height:120px;display:flex;align-items:center;justify-content:center;perspective:600px;margin-top:6px}
.logo .spin{transform-style:preserve-3d;animation:spin 7s linear infinite}
@keyframes spin{from{transform:rotateX(55deg) rotateZ(0)}to{transform:rotateX(55deg) rotateZ(360deg)}}

/* ======= الأحجار ثلاثية الأبعاد ======= */
.tile3d{position:absolute;left:0;top:0;width:calc(var(--u)*2);height:var(--u);transform-style:preserve-3d;--t:calc(var(--u)*.3)}
.tile3d .f{position:absolute}
.tile3d .top{left:0;top:0;width:100%;height:100%;transform:translateZ(var(--t));border-radius:calc(var(--u)*.16);background:var(--tileTop);
  box-shadow:inset 0 0 0 calc(var(--u)*.025) var(--tileEdge),inset 0 calc(var(--u)*.06) calc(var(--u)*.1) rgba(255,255,255,.75)}
.tile3d .sN,.tile3d .sS{left:0;top:0;width:100%;height:var(--t);transform-origin:0 0;background:var(--tileSide)}
.tile3d .sN{transform:rotateX(90deg)}
.tile3d .sS{transform:translateY(var(--u)) rotateX(90deg);filter:brightness(.82)}
.tile3d .sW,.tile3d .sE{left:0;top:0;width:var(--t);height:100%;transform-origin:0 0;background:var(--tileSide);filter:brightness(.9)}
.tile3d .sW{transform:rotateY(-90deg)}
.tile3d .sE{transform:translateX(calc(var(--u)*2)) rotateY(-90deg);filter:brightness(.75)}
.tile3d .shadow{left:calc(var(--u)*-.05);top:calc(var(--u)*.08);width:calc(100% + var(--u)*.12);height:calc(100% + var(--u)*.1);background:rgba(0,0,0,.42);border-radius:calc(var(--u)*.2);filter:blur(calc(var(--u)*.09))}
.tile3d .half{position:absolute;top:0;width:50%;height:100%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--u)*.13)}
.tile3d .half.p{left:0}.tile3d .half.q{right:0}
.tile3d .mid{position:absolute;left:50%;top:14%;bottom:14%;width:calc(var(--u)*.035);margin-left:calc(var(--u)*-.0175);background:var(--line);border-radius:2px;opacity:.75}
.tile3d .pip{width:74%;height:74%;margin:auto;border-radius:50%;background:radial-gradient(circle at 34% 30%,#5a5a5a 0,var(--pipc,var(--pip)) 62%);box-shadow:inset 0 calc(var(--u)*.02) calc(var(--u)*.03) rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.7)}
.pipcol .c1{--pipc:#d63b3b}.pipcol .c2{--pipc:#2f6fd6}.pipcol .c3{--pipc:#1c9a4a}.pipcol .c4{--pipc:#d98b12}.pipcol .c5{--pipc:#8a3fd1}.pipcol .c6{--pipc:#0e0e0e}
.tile3d.back .top{background:linear-gradient(145deg,#2b6e57,#154235)}
.tile3d.back .half,.tile3d.back .mid{display:none}
.tile3d.back{--tileSide:#0f3326}

/* ======= الطاولة ======= */
.arena{flex:1;position:relative;min-height:0;perspective:760px;perspective-origin:50% 8%;overflow:hidden}
.plane{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(36deg);transform-origin:50% 50%}
.felt{position:absolute;inset:0;border-radius:30px;border:12px solid var(--rim);
  background:radial-gradient(70% 70% at 50% 45%,var(--felt1),var(--felt2));
  box-shadow:inset 0 0 40px rgba(0,0,0,.6),inset 0 0 0 3px rgba(255,214,120,.25),0 20px 40px rgba(0,0,0,.6),0 8px 0 #3a210d}
.felt::after{content:"";position:absolute;inset:0;border-radius:18px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px);pointer-events:none}
.board-tile{position:absolute;left:50%;top:50%;margin-left:calc(var(--u)*-1);margin-top:calc(var(--u)*-.5);transform-origin:50% 50%;transform-style:preserve-3d}
.board-tile .tile3d{left:0;top:0}
.board-tile.drop{animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{opacity:0;margin-top:calc(var(--u)*-3)}to{opacity:1}}
.marker{position:absolute;left:50%;top:50%;border:3px dashed var(--gold);border-radius:calc(var(--u)*.2);background:rgba(242,193,78,.22);
  animation:pulse 1s ease-in-out infinite;cursor:pointer;transform-style:preserve-3d;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.empty-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.35);font-weight:800;font-size:18px;text-align:center}

/* ======= شاشة اللعب ======= */
.g-top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 6px}
.scores{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sc{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:3px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.sc b{font-size:17px;color:var(--gold)}
.sc.me{border-color:rgba(242,193,78,.6)}
.tgt{font-size:12px;color:var(--mut);text-align:center}
.strip{display:flex;justify-content:center;gap:8px;padding:0 8px 4px}
.opp{flex:1;max-width:140px;min-width:0;background:rgba(255,255,255,.07);border-radius:16px;padding:6px 4px;text-align:center;border:2px solid transparent;position:relative;transition:.2s}
.opp.turn,.mychip.turn{border-color:var(--gold);box-shadow:0 0 16px rgba(242,193,78,.55)}
.opp .nm,.mychip .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.opp .meta{font-size:12px;color:var(--mut)}
.opp .av{display:flex;justify-content:center;margin-bottom:2px}
.team-dot{position:absolute;top:5px;inset-inline-end:6px;width:10px;height:10px;border-radius:50%}
.team0{background:#4aa3ff}.team1{background:#ff7a59}
.bubble{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);background:#fff;color:#111;border-radius:14px;padding:4px 10px;font-size:22px;z-index:5;animation:pop .25s;box-shadow:0 4px 10px rgba(0,0,0,.4)}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.4);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.actions{display:flex;align-items:center;gap:8px;padding:6px 10px}
.mychip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:16px;padding:5px 10px 5px 12px;border:2px solid transparent;position:relative;min-width:0;flex:1}
.mychip .nm{max-width:110px}
.turnmsg{font-size:12px;color:var(--gold);font-weight:800}
.hand{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:6px 7px;padding:4px 8px max(12px,env(safe-area-inset-bottom));min-height:96px}
.hs{position:relative;perspective:260px;cursor:pointer;flex:none;transition:transform .15s}
.hs .tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-30deg);transform-origin:50% 100%}
.hs .tile3d{transform-origin:0 0;transform:translateX(var(--u)) rotate(90deg)}
.hs.ok{transform:translateY(-6px)}
.hs.ok .tile3d .top{box-shadow:inset 0 0 0 calc(var(--u)*.06) var(--gold),inset 0 calc(var(--u)*.06) calc(var(--u)*.1) rgba(255,255,255,.75)}
.hs.dim{opacity:.55;filter:saturate(.7)}
.hs.sel{transform:translateY(-16px) scale(1.05)}
.hs.hint .tile3d .top{box-shadow:inset 0 0 0 calc(var(--u)*.08) #3dffa0}
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(2,10,7,.86);backdrop-filter:blur(6px);padding:16px;animation:fade .2s}
.panel{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:linear-gradient(#18392d,#0d241c);border:2px solid rgba(242,193,78,.5);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:center}
.panel h2{font-size:26px;color:var(--gold)}
.reveal{display:flex;flex-direction:column;gap:8px}
.reveal .rw{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:14px;padding:6px 8px}
.reveal .rw.win{border:1px solid var(--gold)}
.reveal .tiles{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-height:28px}
.mini{position:relative;flex:none}
.handover .panel{align-items:center}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.big-emoji{font-size:64px}
.qrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.qrow button{font-size:26px;width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.1);cursor:pointer}
.theme-felt-green{--felt1:#1f7a52;--felt2:#0f4a31}
.theme-felt-blue{--felt1:#2a5fa8;--felt2:#14335f}
.theme-felt-red{--felt1:#a83a3a;--felt2:#5c1717}
.theme-felt-black{--felt1:#3a3f46;--felt2:#14171a}
.theme-tile-ivory{--tileTop:linear-gradient(145deg,#fffdf6,#efe6cf);--tileSide:#c9bd9c;--pip:#161616;--line:#7a6a40}
.theme-tile-black{--tileTop:linear-gradient(145deg,#3a3a3f,#0f0f12);--tileSide:#070709;--tileEdge:rgba(255,255,255,.2);--pip:#f4f4f4;--line:#caa24a}
.theme-tile-blue{--tileTop:linear-gradient(145deg,#4f86d8,#1f4796);--tileSide:#183a7d;--tileEdge:rgba(255,255,255,.3);--pip:#fff;--line:#e6f0ff}
.theme-tile-gold{--tileTop:linear-gradient(145deg,#ffe9a0,#d9a21b);--tileSide:#a97800;--tileEdge:rgba(80,50,0,.4);--pip:#3a2300;--line:#6b4a00}
@media (max-height:640px){.logo{height:80px}.title{font-size:28px}}
.screen.game{padding:0;overflow:hidden}
.bd{position:absolute;inset:0;transform-style:preserve-3d}
details summary{outline:none}

/* ===== واقعية الأحجار والطاولة (نسيج بالكود، بلا صور خارجية) ===== */
:root{--ivory:url("data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27140%27 height=%27140%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.85%27 numOctaves=%272%27 stitchTiles=%27stitch%27/%3E%3CfeColorMatrix values=%270 0 0 0 .42  0 0 0 0 .34  0 0 0 0 .2  0 0 0 .11 0%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27/%3E%3C/svg%3E");--feltTex:url("data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27160%27 height=%27160%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.75%27 numOctaves=%273%27 stitchTiles=%27stitch%27/%3E%3CfeColorMatrix values=%270 0 0 0 .02  0 0 0 0 .12  0 0 0 0 .06  0 0 0 .9 -.28%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27/%3E%3C/svg%3E");--woodTex:url("data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27300%27 height=%27300%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.012 .3%27 numOctaves=%273%27/%3E%3CfeColorMatrix values=%270 0 0 0 .36  0 0 0 0 .2  0 0 0 0 .09  0 0 0 1.5 -.35%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 fill=%27%236a3d1a%27/%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27/%3E%3C/svg%3E")}
.tile3d{--t:calc(var(--u)*.34)}
.tile3d .top{border-radius:calc(var(--u)*.2);
  background:radial-gradient(120% 85% at 28% 12%,rgba(255,255,255,.85),rgba(255,255,255,0) 58%),var(--ivory),var(--tileTop);
  box-shadow:inset 0 0 0 calc(var(--u)*.022) rgba(125,98,45,.4),inset 0 calc(var(--u)*.05) calc(var(--u)*.07) rgba(255,255,255,.9),inset 0 calc(var(--u)*-.08) calc(var(--u)*.1) rgba(110,84,36,.38)}
.tile3d .sN,.tile3d .sS,.tile3d .sW,.tile3d .sE{background:var(--ivory),linear-gradient(#f1e8d1,var(--tileSide))}

'use strict';
/* ===== محرك الدومينو + ذكاء البوت (منطق خالص بلا واجهة) ===== */
const ALL_TILES = [];
for (let a = 0; a <= 6; a++) for (let b = a; b <= 6; b++) ALL_TILES.push({ id: ALL_TILES.length, a, b });
const pipsOf = (id) => ALL_TILES[id].a + ALL_TILES[id].b;
const isDbl = (id) => ALL_TILES[id].a === ALL_TILES[id].b;

function shuffle(arr, rnd) {
  rnd = rnd || Math.random;
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

class Game {
  constructor(cfg) {
    this.n = cfg.n;                                  // عدد اللاعبين 2..4
    this.teams = !!cfg.teams && cfg.n === 4;         // فريقان 2 ضد 2
    this.target = cfg.target || 100;
    this.hints = cfg.hints !== false;
    this.rnd = cfg.rnd || Math.random;
    this.scores = Array(this.teams ? 2 : this.n).fill(0);
    this.hasBoneyard = this.n < 4;
    this.round = 0;
    this.lastWinner = null;
    this.phase = 'idle';
    this.hands = []; this.boneyard = []; this.chain = []; this.ends = [null, null];
    this.passInfo = []; this.passes = 0; this.turn = 0; this.forced = null;
    this.centerId = null; this.result = null; this.lastEvent = null; this.gameWinner = null;
  }
  teamOf(s) { return this.teams ? s % 2 : s; }

  newRound() {
    const ids = shuffle(ALL_TILES.map((t) => t.id), this.rnd);
    this.hands = [];
    for (let s = 0; s < this.n; s++) this.hands.push(ids.splice(0, 7));
    this.boneyard = this.hasBoneyard ? ids : [];
    this.chain = []; this.ends = [null, null]; this.centerId = null;
    this.passes = 0; this.round++; this.result = null; this.lastEvent = null;
    this.passInfo = Array.from({ length: this.n }, () => new Set());
    this.phase = 'play';
    if (this.round === 1 || this.lastWinner === null) {
      let bestV = -1, bestSeat = 0, bestId = null;
      for (let s = 0; s < this.n; s++) {
        for (const id of this.hands[s]) {
          const v = isDbl(id) ? 100 + pipsOf(id) : pipsOf(id);
          if (v > bestV) { bestV = v; bestSeat = s; bestId = id; }
        }
      }
      this.turn = bestSeat; this.forced = bestId;      // أعلى دبل يبدأ الجولة الأولى
    } else {
      this.turn = this.lastWinner; this.forced = null;  // الفائز يبدأ بأي حجر
    }
  }

  legal(seat) {
    if (this.phase !== 'play') return [];
    const out = [];
    if (this.chain.length === 0) {
      for (const id of this.hands[seat]) {
        if (this.forced !== null && id !== this.forced) continue;
        out.push({ id, end: 'C' });
      }
      return out;
    }
    const l = this.ends[0], r = this.ends[1];
    for (const id of this.hands[seat]) {
      const t = ALL_TILES[id];
      if (t.a === l || t.b === l) out.push({ id, end: 'L' });
      if (t.a === r || t.b === r) out.push({ id, end: 'R' });
    }
    return out;
  }

  play(seat, id, end) {
    if (this.phase !== 'play' || seat !== this.turn) return { ok: false, err: 'turn' };
    if (!this.legal(seat).some((m) => m.id === id && m.end === end)) return { ok: false, err: 'illegal' };
    const t = ALL_TILES[id];
    let a = t.a, b = t.b;
    if (end === 'C') { this.chain.push({ id, a, b }); this.ends = [a, b]; this.centerId = id; }
    else if (end === 'R') { if (a !== this.ends[1]) { const x = a; a = b; b = x; } this.chain.push({ id, a, b }); this.ends[1] = b; }
    else { if (b !== this.ends[0]) { const x = a; a = b; b = x; } this.chain.unshift({ id, a, b }); this.ends[0] = a; }
    this.hands[seat].splice(this.hands[seat].indexOf(id), 1);
    this.passes = 0; this.forced = null;
    this.lastEvent = { seat, type: 'play', id, end };
    if (this.hands[seat].length === 0) { this._endRound(seat, 'domino'); return { ok: true, ended: true }; }
    this.turn = (this.turn + 1) % this.n;
    return { ok: true };
  }

  canDraw(seat) {
    return this.phase === 'play' && seat === this.turn && this.boneyard.length > 0 && this.legal(seat).length === 0;
  }
  draw(seat) {
    if (!this.canDraw(seat)) return { ok: false };
    const id = this.boneyard.pop();
    this.hands[seat].push(id);
    this.lastEvent = { seat, type: 'draw', id };
    return { ok: true, id };
  }
  canPass(seat) {
    return this.phase === 'play' && seat === this.turn && this.boneyard.length === 0 && this.legal(seat).length === 0;
  }
  pass(seat) {
    if (!this.canPass(seat)) return { ok: false };
    this.passInfo[seat].add(this.ends[0]); this.passInfo[seat].add(this.ends[1]);
    this.passes++;
    this.lastEvent = { seat, type: 'pass' };
    if (this.passes >= this.n) { this._endRound(null, 'blocked'); return { ok: true, ended: true }; }
    this.turn = (this.turn + 1) % this.n;
    return { ok: true };
  }

  handTotal(seat) { return this.hands[seat].reduce((s, id) => s + pipsOf(id), 0); }

  _endRound(winnerSeat, reason) {
    const totals = this.hands.map((h) => h.reduce((s, id) => s + pipsOf(id), 0));
    const res = { reason, hands: this.hands.map((h) => h.slice()), totals, winnerSeat: null, winnerTeam: null, points: 0 };
    if (reason === 'domino') {
      const wt = this.teamOf(winnerSeat);
      let pts = 0;
      for (let s = 0; s < this.n; s++) if (this.teamOf(s) !== wt) pts += totals[s];
      res.winnerSeat = winnerSeat; res.winnerTeam = wt; res.points = pts;
    } else {
      const T = this.scores.map(() => 0);
      for (let s = 0; s < this.n; s++) T[this.teamOf(s)] += totals[s];
      const min = Math.min(...T);
      const wins = T.map((v, i) => (v === min ? i : -1)).filter((i) => i >= 0);
      if (wins.length > 1) { res.reason = 'tie'; }
      else {
        const wt = wins[0];
        let opp = 0; T.forEach((v, i) => { if (i !== wt) opp += v; });
        res.winnerTeam = wt; res.points = Math.max(0, opp - T[wt]);
        let bs = -1, bv = 1e9;
        for (let s = 0; s < this.n; s++) if (this.teamOf(s) === wt && totals[s] < bv) { bv = totals[s]; bs = s; }
        res.winnerSeat = bs;
      }
    }
    if (res.winnerTeam !== null) this.scores[res.winnerTeam] += res.points;
    this.lastWinner = res.winnerSeat !== null ? res.winnerSeat : this.turn;
    this.result = res;
    const top = Math.max(...this.scores);
    const leaders = this.scores.filter((v) => v === top).length;
    if (top >= this.target && leaders === 1) { this.phase = 'gameEnd'; this.gameWinner = this.scores.indexOf(top); }
    else this.phase = 'roundEnd';
  }
}

/* ===== البوت ===== */
function endsAfter(g, m) {
  const t = ALL_TILES[m.id];
  let l = g.ends[0], r = g.ends[1];
  if (m.end === 'C') { l = t.a; r = t.b; }
  else if (m.end === 'R') r = t.a === g.ends[1] ? t.b : t.a;
  else l = t.b === g.ends[0] ? t.a : t.b;
  return [l, r];
}

function scoreMove(g, seat, m, level) {
  const [nl, nr] = endsAfter(g, m);
  const rest = g.hands[seat].filter((x) => x !== m.id);
  let sc = pipsOf(m.id) * (level === 'hard' ? 0.8 : 1) + (isDbl(m.id) ? (level === 'hard' ? 4 : 3) : 0);
  if (level === 'medium') return sc + g.rnd() * 3;
  if (rest.length === 0) return 1000;
  let match = 0; const hold = Array(7).fill(0);
  for (const id of rest) {
    const t = ALL_TILES[id];
    if (t.a === nl || t.b === nl || t.a === nr || t.b === nr) match++;
    hold[t.a]++; if (t.b !== t.a) hold[t.b]++;
  }
  sc += match * 2 + 0.5 * (hold[nl] + hold[nr]);
  if (match === 0) sc -= 3;
  for (let o = 0; o < g.n; o++) {
    if (o === seat) continue;
    const partner = g.teams && g.teamOf(o) === g.teamOf(seat);
    const info = g.passInfo[o];
    if (!info) continue;
    for (const v of [nl, nr]) if (info.has(v)) sc += partner ? -2 : 2.5;
  }
  return sc + g.rnd() * 0.5;
}

function botDecide(g, seat, level) {
  const legal = g.legal(seat);
  if (legal.length === 0) return g.canDraw(seat) ? { type: 'draw' } : { type: 'pass' };
  let pick;
  if (level === 'easy') pick = legal[Math.floor(g.rnd() * legal.length)];
  else {
    let best = -1e9;
    for (const m of legal) { const s = scoreMove(g, seat, m, level); if (s > best) { best = s; pick = m; } }
  }
  return { type: 'play', id: pick.id, end: pick.end };
}

if (typeof module !== 'undefined') module.exports = { Game, ALL_TILES, botDecide, pipsOf, isDbl, endsAfter, scoreMove, shuffle };

    if (this.pw !== W || this.ph !== H) { this.plane.style.width = W + 'px'; this.plane.style.height = H + 'px'; this.pw = W; this.ph = H; }
    const lay = layoutChain(v, W / H < 1.5 ? 5 : 6.5);
    const myTurn = v.phase === 'play' && v.turn === v.mySeat;
    bd.querySelectorAll('.empty-hint').forEach(e => e.remove()); this.mkLayer.replaceChildren();
    this.placed = {};
    if (!v.chain.length) {
      this.tileEls.forEach(e => e.remove()); this.tileEls.clear();
      const u = 34;
      if (myTurn && this.sel != null) this.mkLayer.appendChild(this.marker(0, 0, 2, 1, u, 'C', '', this.sel, this.ghostFor('C', null)));
      else bd.appendChild(h('div', { class: 'empty-hint', text: v.forced != null && myTurn ? T('ابدأ بأعلى دبل ♦') : (myTurn ? T('اختر حجرًا للبدء') : T('بانتظار البداية…')) }));
      return;
    }
    const b = lay.bbox, bw = b.x1 - b.x0, bh = b.y1 - b.y0;
    const u = Math.max(11, Math.min(60, (W - 28) / (bw + 0.4), (H - 28) / (bh + 0.4)));
    const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2, B = 60, keep = new Set();
    this.geom = { u, cx, cy };
    for (const t of lay.tiles) {
      keep.add(t.id);
      this.placed[t.id] = { p: t.p, q: t.q, rot: t.rot, u };
      const tf = `translate(${(t.x - cx) * u}px,${(t.y - cy) * u}px) rotate(${t.rot}deg) scale(${u / B})`;
      let el = this.tileEls.get(t.id);
      if (!el) {   // حجر جديد: يُبنى مرة واحدة بحجم ثابت ثم يُكبَّر/يُصغَّر بالتحويل فقط (سريع وسلس)
        el = h('div', { class: 'board-tile', 'data-id': t.id, style: { '--u': B + 'px', width: 2 * B + 'px', height: B + 'px', transition: 'none', transform: tf } },
          (() => { const e = tile3d(t.p, t.q, B * 0.95, false, t.rot); e.style.left = (B * 0.05) + 'px'; e.style.top = (B * 0.025) + 'px'; return e; })());
        if (this.flying.has(t.id)) el.style.visibility = 'hidden';
        bd.appendChild(el); this.tileEls.set(t.id, el);
        void el.offsetWidth; el.style.transition = '';
      } else el.style.transform = tf;
      el.style.zIndex = String(Math.round((t.y + 60) * 100) + Math.round(t.x + 60));   // الأقرب للمشاهد فوق الأبعد: لا يتداخل حجر فوق آخر
    }
    this.tileEls.forEach((el, id) => { if (!keep.has(id)) { el.remove(); this.tileEls.delete(id); } });
    if (myTurn && this.sel != null) {
      for (const m of v.legal.filter(m => m.id === this.sel)) {
        const sl = lay.slots[m.end]; if (!sl) continue;
        this.mkLayer.appendChild(this.marker(sl.x - cx, sl.y - cy, sl.w, sl.h, u, m.end, String(v.ends[m.end === 'L' ? 0 : 1]), this.sel, this.ghostFor(m.end, sl)));
      }
    }
  },
  ghostFor(end, slot) {
    const t = ALL_TILES[this.sel]; if (!t) return null;
    if (end === 'C') return { p: t.a, q: t.b, rot: 0 };
    const ev = this.view.ends[end === 'L' ? 0 : 1];
    return { p: ev, q: t.a === ev ? t.b : t.a, rot: slot.rot };
  },
  /* المستطيل الذي يشغله موضع على الشاشة بعد إسقاط الطاولة المائلة */
  slotRect(x, y, w, hh, u) {
    const probe = h('div', { style: { position: 'absolute', left: '50%', top: '50%', width: w * u + 'px', height: hh * u + 'px', margin: (-hh * u / 2) + 'px 0 0 ' + (-w * u / 2) + 'px', transform: `translate(${x * u}px,${y * u}px)`, visibility: 'hidden' } });
    this.bd.appendChild(probe);
    const r = probe.getBoundingClientRect(), a = this.arena.getBoundingClientRect();
    probe.remove();
    return { left: r.left - a.left, top: r.top - a.top, w: r.width, h: r.height };
  },
  /* علامة اختيار الطرف: عنصر عادي (غير مائل) فوق الطاولة، فلا يغطيها أي حجر ولمستها مضمونة */
  marker(x, y, w, hh, u, end, label, id, gh) {
    const r = this.slotRect(x, y, w, hh, u);
    const mk = h('div', { class: 'marker', 'data-end': end, style: { left: r.left + 'px', top: r.top + 'px', width: r.w + 'px', height: r.h + 'px' }, onclick: () => this.play({ id, end }) });
    if (gh) mk.appendChild(h('div', { class: 'ghost', style: { width: 2 * u * 0.95 + 'px', height: u * 0.95 + 'px', transform: 'translate(-50%,-50%) perspective(900px) rotateX(30deg) rotate(' + gh.rot + 'deg)' } }, tile3d(gh.p, gh.q, u * 0.95, false, gh.rot)));
    return mk;
  },

  renderHand() {
    const v = this.view, box = this.hand;
    const ids = v.hand.slice().sort((x, y) => ALL_TILES[x].a - ALL_TILES[y].a || ALL_TILES[x].b - ALL_TILES[y].b);
    const n = Math.max(1, ids.length), W = Math.max(280, (this.root.clientWidth || 360) - 24);
    const rows = Math.ceil(n / 7), per = Math.min(n, 7);
    const u = Math.max(22, Math.min(rows === 1 ? 42 : (rows === 2 ? 34 : 28), Math.floor(W / per) - 9));
    const myTurn = v.phase === 'play' && v.turn === v.mySeat;
    const ok = new Set(v.legal.map(m => m.id));
    const sig = [ids.join(','), myTurn ? v.legal.map(m => m.id).join('.') : '-', this.sel, this.hintId, u, Sett.tile, TileRT.cur, Sett.pipc ? 1 : 0].join('|');
    if (sig === this.handSig) return;
    this.handSig = sig; box.replaceChildren();
    for (let r = 0; r < rows; r++) {
      const row = h('div', { class: 'rackrow' });
      ids.slice(r * 7, r * 7 + 7).forEach(id => {
        const t = ALL_TILES[id];
        row.appendChild(h('div', {
          'data-id': id,
          class: 'hs' + (myTurn ? (ok.has(id) ? ' ok' : ' dim') : '') + (this.sel === id ? ' sel' : '') + (this.hintId === id ? ' hint' : ''),
          style: { width: u + 'px', height: 2 * u + 'px', '--u': u + 'px', 'margin-top': Math.round(u * 0.32) + 'px' }, onclick: () => this.pick(id),
        }, h('div', { class: 'tilt' }, tile3d(t.a, t.b, u, false, -90, 0.5))));
      });
      box.appendChild(row);
    }
  },

  renderActions() {
    const v = this.view, myTurn = v.phase === 'play' && v.turn === v.mySeat, m = this.meta.seats[v.mySeat] || { name: T('أنا'), avatar: 'e:🙂' };
    const c = this.mychip; c.className = 'mychip' + (myTurn ? ' turn' : ''); c.replaceChildren(
      avatarEl(m.avatar, 36), h('div', { style: { 'min-width': 0 } }, h('div', { class: 'nm', text: m.name }), h('div', { class: 'meta', text: (v.teams ? T('نقاط الفريق: ') : T('نقاطي: ')) + (v.teams ? v.scores[v.mySeat % 2] : v.scores[v.mySeat]) }),
        h('div', { class: 'turnmsg', text: v.phase !== 'play' ? '' : (myTurn ? (v.canDraw ? T('اسحب حجرًا') : (v.canPass ? T('لا حجر مناسب…') : T('دورك الآن!'))) : T('دور ') + this.nm(v.turn)) })));
    if (v.teams) c.appendChild(h('span', { class: 'team-dot team' + (v.mySeat % 2) }));
    this.drawBtn.style.display = v.n < 4 ? '' : 'none';
    this.drawBtn.textContent = T('سحب (') + v.boneyard + ')';
    this.drawBtn.disabled = !v.canDraw;
    this.hintBtn.style.display = (Sett.hints && v.hints !== false) ? '' : 'none';
  },

  pick(id) {
    const v = this.view; Snd.unlock();
    if (v.phase !== 'play') return;
    if (v.turn !== v.mySeat) { toast(T('ليس دورك بعد')); Snd.bad(); return; }
    const mv = v.legal.filter(m => m.id === id);
    if (!mv.length) { Snd.bad(); toast(v.canDraw ? T('لا يناسب الأحجار المفتوحة — اسحب من المخزون') : T('هذا الحجر لا يناسب أي طرف')); return; }
    if (mv.length === 1) return this.play(mv[0]);
    if (v.ends[0] === v.ends[1]) return this.play({ id, end: 'R' });
    this.sel = this.sel === id ? null : id; this.renderBoard(); this.renderHand();
    if (this.sel != null) toast(T('اختر الطرف الذي تريد اللعب عليه'));
  },
  play(m) { if (m.id == null) return; this.sel = null; Cur.sess.localAct({ type: 'play', id: m.id, end: m.end }); },
  doDraw() { Snd.unlock(); if (this.view && this.view.canDraw) Cur.sess.localAct({ type: 'draw' }); },
  doHint() {
    const v = this.view; if (v && v.hints === false) { toast(T('التلميح معطّل في هذه المباراة')); return; }
    if (!v || v.phase !== 'play' || v.turn !== v.mySeat) { toast(T('التلميح متاح في دورك فقط')); return; }
    if (!v.legal.length) { toast(v.canDraw ? T('ليس لديك حجر مناسب، اسحب') : T('لا يوجد لعب ممكن')); return; }
    let best = null, bv = -1e9;
    for (const m of v.legal) {
      const t = ALL_TILES[m.id], rest = v.hand.filter(x => x !== m.id).map(i => ALL_TILES[i]);
      let e0 = v.ends[0], e1 = v.ends[1];
      if (!v.chain.length) { e0 = t.a; e1 = t.b; } else if (m.end === 'L') e0 = t.b === e0 ? t.a : t.b; else e1 = t.a === e1 ? t.b : t.a;
      const match = rest.filter(r => r.a === e0 || r.b === e0 || r.a === e1 || r.b === e1).length;
      const s = (t.a + t.b) * 0.8 + (t.a === t.b ? 4 : 0) + match * 2;
      if (s > bv) { bv = s; best = m; }
    }
    this.hintId = best.id; this.renderHand(); Snd.chat();
    setTimeout(() => { if (this.hintId === best.id) { this.hintId = null; if (this.view) this.renderHand(); } }, 5000);
  },

  /* كتابة رسالة: للجميع، أو (في وضع الفريقين) لشريكك فقط */
  writeMsg() {
    const v = this.view; let scope = 'all', m;
    const inp = h('input', { class: 'input', maxlength: 120, placeholder: T('اكتب رسالتك…'), enterkeyhint: 'send' });
    const send = () => { const t = inp.value.trim(); if (!t) return; m.close(); Cur.sess.localText(scope, t); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    const kids = [h('h2', { text: T('إرسال رسالة') })];
    if (v && v.teams) kids.push(chipGroup([['all', T('👥 للجميع')], ['team', T('🤝 لشريكي فقط')]], 'all', k => { scope = k; }));
    else kids.push(h('p', { class: 'sub', text: T('👥 ستصل رسالتك لجميع اللاعبين') }));
    kids.push(inp, h('button', { class: 'btn', text: T('إرسال ➤'), onclick: send }));
    m = modal(kids); setTimeout(() => inp.focus(), 150);
  },
  showText(seat, scope, text) {
    if (!this.feed) return; Snd.chat();
    const row = h('div', { class: 'cmsg' + (scope === 'team' ? ' team' : '') }, h('b', { text: this.nm(seat) + (scope === 'team' ? T(' (للفريق)') : '') + ': ' }), h('span', { text }));
    this.feed.appendChild(row);
    while (this.feed.children.length > 4) this.feed.firstChild.remove();
    setTimeout(() => row.remove(), 8000);
  },

  bubble(seat, c) {
    if (!this.root || !this.view) return;
    Snd.chat();
    const v = this.view; let host;
    if (seat === v.mySeat) host = this.mychip; else host = this.strip.querySelector('[data-seat="' + seat + '"]');
    if (!host) return;
    const b = h('div', { class: 'bubble', text: CHATS[c] || '👍' }); host.appendChild(b);
    setTimeout(() => b.remove(), 2600);
  },

  countStats() {
    const v = this.view, s = Cur.sess;
    if (!s || s.kind === 'hotseat' || v.phase === 'play' || !v.result) return;
    const key = 'r' + v.round; if (s.counted[key]) return; s.counted[key] = 1;
    Stats.rounds++; if (v.result.winnerTeam === this.myTeam()) { Stats.roundsWon++; Stats.points += v.result.points; }
    if (v.phase === 'gameEnd') { Stats.games++; if (v.gameWinner === this.myTeam()) Stats.wins++; }
    Store.set('stats', Stats);
  },

  /* ----- نوافذ نهاية الجولة/اللعبة وتسليم الجهاز ----- */
  overlays(opts) {
    const v = this.view;
    const key = v.phase === 'play' ? (opts.handover ? 'ho:' + v.turn + ':' + v.seq : 'play') : v.phase + ':' + v.round;
    if (key === this.shownKey) return;
    this.shownKey = key;
    document.querySelectorAll('.overlay').forEach(e => e.remove());
    if (v.phase === 'play') { if (opts.handover) this.handover(v.mySeat); return; }
    if (Sett.tile === 'random' || Sett.felt === 'random') { pickLooks(); this.renderBoard(); this.renderHand(); }
    this.resultPanel();
  },
  handover(seat) {
    const m = this.meta.seats[seat];
    document.body.appendChild(h('div', { class: 'overlay handover' }, h('div', { class: 'panel' },
      avatarEl(m.avatar, 84), h('h2', { text: T('دور ') + m.name }), h('p', { text: T('سلّم الهاتف إلى ') + m.name + T(' ثم اضغط «أنا جاهز» حتى لا يرى الآخرون أحجارك.'), style: { margin: '0' } }),
      h('button', { class: 'btn', text: T('أنا جاهز ✔'), onclick: e => { e.currentTarget.closest('.overlay').remove(); this.hand.style.visibility = ''; } }))));
  },
  resultPanel() {
    const v = this.view, r = v.result, s = Cur.sess; if (!r) return;
    const mt = this.myTeam(), over = v.phase === 'gameEnd';
    let title, emoji, win = false;
    if (over) {
      win = v.gameWinner === mt;
      if (s.kind === 'hotseat') { const w = v.teams ? T('الفريق ') + (v.gameWinner === 0 ? T('الأول') : T('الثاني')) : this.nm(v.gameWinner); title = T('الفائز: ') + w; win = true; }
      else title = win ? (v.teams ? T('فزتم بالمباراة! 🏆') : T('فزت بالمباراة! 🏆')) : (v.teams ? T('خسرتم المباراة') : T('خسرت المباراة'));
      emoji = win ? '🏆' : '😔';
    } else if (r.reason === 'tie') { title = T('تعادل في الجولة'); emoji = '🤝'; }
    else {
      win = r.winnerTeam === mt;
      if (s.kind === 'hotseat') title = T('فاز ') + (v.teams ? T('الفريق ') + (r.winnerTeam === 0 ? T('الأول') : T('الثاني')) : this.nm(r.winnerSeat)) + T(' بالجولة');
      else title = win ? (v.teams ? T('فزتم بالجولة! 🎉') : T('فزت بالجولة! 🎉')) : T('خسرت الجولة');
      emoji = win ? '🎉' : '😕';
    }
    if (win && s.kind !== 'hotseat') { Snd.win(); this.confetti(); } else if (!win && s.kind !== 'hotseat') Snd.lose(); else Snd.win();
    const why = r.reason === 'domino' ? this.nm(r.winnerSeat) + T(' أنهى كل أحجاره (دومينو!)') : r.reason === 'blocked' ? T('الطاولة مغلقة — الأقل نقاطًا يفوز') : T('تعادل في الإغلاق، لا نقاط');
    const rows = [];
    for (let i = 0; i < v.n; i++) {
      const m = this.meta.seats[i] || { name: T('؟'), avatar: 'e:🙂' };
      const tiles = (r.hands[i] || []).map(id => { const t = ALL_TILES[id]; return h('div', { class: 'mini', style: { width: '26px', height: '13px' } }, tile3d(t.a, t.b, 13, false, 0)); });
      rows.push(h('div', { class: 'rw' + (r.winnerSeat === i ? ' win' : '') }, avatarEl(m.avatar, 30),
        h('div', { style: { width: '62px', 'text-align': 'start', 'font-size': '12px', 'font-weight': '800', overflow: 'hidden', 'text-overflow': 'ellipsis', 'white-space': 'nowrap' }, text: m.name }),
        h('div', { class: 'tiles' }, tiles.length ? tiles : h('span', { text: '—', style: { color: '#9be8c3' } })), h('b', { text: String(r.totals[i] != null ? r.totals[i] : 0) })));
    }
    const sb = v.teams ? [T('الفريق الأول'), T('الفريق الثاني')].map((n, i) => n + ': ' + v.scores[i]).join('  |  ') : v.scores.map((x, i) => this.nm(i) + ': ' + x).join('  |  ');
    const btns = [];
    if (over) {
      if (s.isHost) btns.push(h('button', { class: 'btn', text: T('إعادة المباراة 🔁'), onclick: () => { document.querySelectorAll('.overlay').forEach(e => e.remove()); s.rematch(); } }));
      else btns.push(h('p', { text: T('بانتظار المضيف لبدء مباراة جديدة…'), style: { color: '#a9b8b0', margin: '0' } }));
      btns.push(h('button', { class: 'btn ghost', text: T('القائمة الرئيسية'), onclick: () => Nav.home() }));
    } else {
      if (s.isHost) btns.push(h('button', { class: 'btn', text: T('الجولة التالية ▶'), onclick: () => { document.querySelectorAll('.overlay').forEach(e => e.remove()); this.shownKey = ''; s.nextRound(); } }));
      else btns.push(h('p', { text: T('بانتظار المضيف لبدء الجولة التالية…'), style: { color: '#a9b8b0', margin: '0' } }));
      btns.push(h('button', { class: 'btn ghost small', text: T('🚪 انسحاب من المباراة'), onclick: () => Dlg.confirm(T('مغادرة؟'), T('ستخسر تقدّم هذه المباراة.'), T('مغادرة'), () => Nav.home(), true) }));
    }
    document.body.appendChild(h('div', { class: 'overlay' }, h('div', { class: 'panel' },
      h('div', { class: 'big-emoji', text: emoji }), h('h2', { text: title }), h('p', { text: why, style: { margin: '0' } }),
      r.winnerTeam != null && r.winnerTeam >= 0 ? h('p', { text: '+' + r.points + T(' نقطة'), style: { margin: '0', 'font-size': '22px', 'font-weight': '900', color: '#9be8c3' } }) : null,
      h('div', { class: 'reveal' }, rows), h('p', { text: sb, style: { margin: '0', 'font-size': '13px', color: '#a9b8b0' } }), btns)));
  },
  confetti() {
    const cols = ['#f2c14e', '#58d39a', '#ff7a59', '#4aa3ff', '#fff'];
    for (let i = 0; i < 46; i++) {
      const c = h('div', { class: 'confetti', style: { left: Math.random() * 100 + 'vw', background: cols[i % 5], 'animation-duration': 2 + Math.random() * 2.4 + 's', 'animation-delay': Math.random() * .6 + 's' } });
      document.body.appendChild(c); setTimeout(() => c.remove(), 5200);
    }
  },

/* ===== الشاشات ===== */
let Prof = Store.get('profile', null);
const MODES = [
  { k: 't4', n: 4, teams: true, get label() { return T('٤ لاعبين · فريقان (٢ ضد ٢)'); } },
  { k: 'f4', n: 4, teams: false, get label() { return T('٤ لاعبين · فردي'); } },
  { k: 'f3', n: 3, teams: false, get label() { return T('٣ لاعبين'); } },
  { k: 'f2', n: 2, teams: false, get label() { return T('لاعبان'); } },
];
const LEVELS = [];
function refreshConsts() { LEVELS.length = 0; [['easy', T('سهل')], ['medium', T('متوسط')], ['hard', T('صعب')]].forEach(x => LEVELS.push(x)); }
refreshConsts();
const TARGETS = [50, 100, 150, 200];

function chipGroup(opts, val, onChange) {
  const box = h('div', { class: 'chips' });
  opts.forEach(([k, label]) => box.appendChild(h('div', {
    class: 'chip' + (k === val ? ' on' : ''), text: label,
    onclick: e => { box.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); e.currentTarget.classList.add('on'); onChange(k); },
  })));
  return box;
}
function copyText(t) {
  const fb = () => { const ta = h('textarea', { style: { position: 'fixed', opacity: '0' } }); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(T('تم النسخ ✔')); } catch (e) { toast(T('انسخ النص يدويًا')); } ta.remove(); };
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(() => toast(T('تم النسخ ✔')), fb); return; } } catch (e) { /* */ }
  fb();

const LAN = (typeof window !== 'undefined' && window.AndroidLAN) ? window.AndroidLAN : null;
const LanNet = { onconn: null, joinCb: null, peers: {} };
LanNet.mkPeer = id => {
  const p = { id, open: true, pin: '', onmessage: null, onclose: null,
    send(o) { try { LAN.send(id, JSON.stringify(o)); } catch (e) { /* */ } },
    close() { try { LAN.close(id); } catch (e) { /* */ } } };
  LanNet.peers[id] = p; return p;
};
window.__lan = function (ev) {
  try {
    if (!ev || typeof ev !== 'object' || !LAN) return;
    const id = ev.id;
    if (ev.e === 'conn') { const p = LanNet.mkPeer(id); if (LanNet.onconn) LanNet.onconn(p); else p.close(); }
    else if (ev.e === 'joined') { const p = LanNet.mkPeer(id); if (LanNet.joinCb) LanNet.joinCb(null, p); else p.close(); }
    else if (ev.e === 'joinfail') { if (LanNet.joinCb) LanNet.joinCb(String(ev.msg || 'notfound')); }
    else if (ev.e === 'msg') {
      const p = LanNet.peers[id]; if (!p || !p.onmessage) return;
      let m; try { m = JSON.parse(String(ev.line)); } catch (x) { return; }
      if (m && typeof m === 'object' && !Array.isArray(m)) p.onmessage(m);
    } else if (ev.e === 'closed') {
      const p = LanNet.peers[id]; delete LanNet.peers[id];
      if (p) { p.open = false; if (p.onclose) p.onclose(); }
    } else if (ev.e === 'error') toast(String(ev.msg || T('خطأ في الاتصال')));
  } catch (x) { /* لا نكسر الواجهة بسبب رسالة سيئة */ }
};

        status.textContent = T('تم الاتصال ✔'); peer.send({ t: 'hello', name: Prof.name, avatar: Prof.avatar }); Screens.waiting(peer);
      };
      try { LAN.join(pin, adv.get()); } catch (x) { btn.disabled = false; status.textContent = T('تعذّر الاتصال.'); }
    } });
    const node = h('div', { class: 'screen' }, header(T('انضمام إلى غرفة'), () => { LanNet.joinCb = null; Screens.multi(); }),
      h('div', { class: 'col', style: { 'margin-top': '10px' } },
        h('div', { class: 'card' }, h('p', { style: { margin: 0, 'line-height': '1.9', 'font-size': '14px' }, text: T('اتصل أولًا بنقطة اتصال هاتف المضيف (من إعدادات الواي فاي)، ثم اكتب الرمز الذي أعطاك إياه.') })),
        h('div', { class: 'card' }, h('div', { class: 'lbl', text: T('رمز المضيف') }), pinIn), adv.box, btn, status));
    Nav.show(node, 'lanjoin');
  };
}
</script>
